            // Match by game ID, not schedule order, so refreshed schedules stay correct.
            const predictions = new Map((payload.games || []).map(game => [String(game.gameId), game.winPrediction]));

                const prediction = predictions.get(element.dataset.gameId);

                if (!prediction || !Number.isFinite(Number(prediction.awayWinPercent)) || !Number.isFinite(Number(prediction.homeWinPercent))) {
                    element.textContent = "Win estimate unavailable: insufficient recent team results.";
