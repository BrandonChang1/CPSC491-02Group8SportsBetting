<!DOCTYPE html>
<html lang="en">

<head>

            align-items: center;

            min-height: 100vh;
        }

        .welcome-container {
            background-color: white;

            padding: 50px;
            border-radius: 10px;

        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 30px;
            color: #555;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-button {
            display: block;

            padding: 12px 20px;

            text-decoration: none;

            background-color: #222;
            color: white;

        }

    <div class="welcome-container">

        <p>

        </p>

        <div class="button-container">

            <a href="/test.html" class="nav-button">
                Open NBA Data Test
            </a>

            <a href="/create-account.html" class="nav-button">

            </a>
            <a href="/player-search.html" class="nav-button">
