<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your account | NBA Player Analytics</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="header-inner"><div class="brand">NBA <span>/</span> Player Analytics</div><a href="/" class="back-link">← Back to home</a></div></header><main><div class="auth-wrap"><div class="card"><p class="eyebrow">Secure account access</p><h1>Create your account</h1><p class="subtitle">Get started with the NBA analytics dashboard.</p><form id="createAccountForm">
    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      name="username"
      autocomplete="username"
      minlength="3"
      maxlength="30"
      required
    >

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      name="email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      autocomplete="new-password"
      minlength="8"
      required
    >

    <button type="submit">Create Account</button>
    <p id="message" role="status" aria-live="polite"></p>
  </form><div class="auth-links"><a href="/login.html">Already have an account? Log in</a><a href="/">Return to welcome page</a></div></div></div></main><script>
    const form = document.getElementById('createAccountForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Creating account...';

      const payload = {
        username: form.username.value,
        email: form.email.value,
        password: form.password.value
      };

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        message.textContent = result.message;

        if (response.ok) {
          form.reset();
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 700);
        }
      } catch (error) {
        message.textContent = 'Could not reach the server.';
      }
    });
  </script></body></html>
