<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upcoming Games | NBA Player Analytics</title><link rel="stylesheet" href="/styles.css"><style>
    .win-estimate { margin-top: 12px; width: 100%; }
    .win-estimate .prob-labels { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: .9rem; font-weight: 600; }
    .win-estimate .prob-bar { display: flex; height: 12px; border-radius: 8px; overflow: hidden; background: #cbd5e1; margin-top: 7px; }
    .win-estimate .prob-away { background: #2563eb; }
    .win-estimate .prob-home { background: #0d9488; }
    .win-estimate .prediction-note { margin-top: 7px; font-size: .8rem; opacity: .8; }
</style></head><body><header><div class="header-inner"><div class="brand">NBA <span>/</span> Player Analytics</div><a data-testid="back-home" href="/" class="back-link">← Back to home</a></div></header><main data-testid="upcoming-games-page"><p class="eyebrow">NBA schedule</p><h1 data-testid="upcoming-games-heading">Upcoming games</h1><p class="subtitle">Browse scheduled NBA games over the next two weeks, sourced through the project's nba_api integration.</p><section class="intro"><div class="toolbar"><p id="status" data-testid="schedule-status" role="status" aria-live="polite">Loading upcoming games...</p><button id="refresh" data-testid="schedule-refresh" type="button">↻ Refresh schedule</button></div></section><div id="games" data-testid="schedule-results" aria-live="polite"></div></main><script>
    const gamesElement = document.getElementById("games");
    const statusElement = document.getElementById("status");
    const refreshButton = document.getElementById("refresh");

    function formatDate(date) {
        return new Intl.DateTimeFormat(undefined, {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }).format(date);
    }

    function formatTime(date) {
        return new Intl.DateTimeFormat(undefined, {
            hour: "numeric",
            minute: "2-digit",
            timeZoneName: "short"
        }).format(date);
    }

    function arenaText(arena) {
        const location = [arena?.city, arena?.state].filter(Boolean).join(", ");
        return [arena?.name, location].filter(Boolean).join(" - ");
    }

    function renderGames(games) {
        gamesElement.innerHTML = "";

        if (!games.length) {
            gamesElement.innerHTML = '<div class="message">No NBA games are scheduled in the next two weeks.</div>';
            return;
        }

        const groups = new Map();
        for (const game of games) {
            const tipoff = new Date(game.tipoffUtc);
            const key = tipoff.toLocaleDateString("en-CA");
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push({ ...game, tipoff });
        }

        for (const [, dayGames] of groups) {
            const section = document.createElement("section");
            section.className = "date-group";

            const heading = document.createElement("h2");
            heading.textContent = formatDate(dayGames[0].tipoff);
            section.appendChild(heading);

            for (const game of dayGames) {
                const card = document.createElement("article");
                card.className = "game-card";
                card.dataset.testid = "schedule-game";

                const left = document.createElement("div");
                const matchup = document.createElement("div");
                matchup.className = "matchup";
                matchup.dataset.testid = "schedule-matchup";
                matchup.textContent = `${game.awayTeam.name} at ${game.homeTeam.name}`;

                const details = document.createElement("div");
                details.className = "details";
                const detailsParts = [];
                if (game.gameLabel) detailsParts.push(game.gameLabel);
                const arena = arenaText(game.arena);
                if (arena) detailsParts.push(arena);
                details.textContent = detailsParts.join(" • ") || game.status;

                const time = document.createElement("div");
                time.className = "tipoff";
                time.textContent = formatTime(game.tipoff);

                left.append(matchup, details);
                const estimate = document.createElement("div");
                estimate.className = "win-estimate";
                estimate.dataset.gameId = String(game.gameId || "");
                estimate.textContent = "Loading win estimate...";
                left.appendChild(estimate);
                card.append(left, time);
                section.appendChild(card);
            }

            gamesElement.appendChild(section);
        }
    }

    async function loadGames() {
        refreshButton.disabled = true;
        statusElement.textContent = "Loading upcoming games...";
        gamesElement.innerHTML = "";

        try {
            const response = await fetch("/api/upcoming-games", { cache: "no-store" });
            const payload = await response.json();

            if (!response.ok || !payload.success) {
                throw new Error(payload.message || "Unable to retrieve NBA games.");
            }

            statusElement.textContent = `${payload.count} scheduled game${payload.count === 1 ? "" : "s"} found.`;
            renderGames(payload.games || []);
        } catch (error) {
            statusElement.textContent = "Unable to load the schedule.";
            gamesElement.innerHTML = `<div class="message error"></div>`;
            gamesElement.querySelector(".error").textContent = error.message;
        } finally {
            refreshButton.disabled = false;
        }
    }

    refreshButton.addEventListener("click", loadGames);
    loadGames();
</script></body></html>
